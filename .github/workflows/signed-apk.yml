name: Signed Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check app
        run: |
          bun run check
          bun test

      - name: Generate Android project
        run: CI=1 bunx expo prebuild --platform android --no-install

      - name: Restore release keystore
        env:
          FOLIO_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIO_ANDROID_KEYSTORE_BASE64 }}
          FOLIO_ANDROID_STORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_STORE_PASSWORD }}
          FOLIO_ANDROID_KEY_ALIAS: ${{ secrets.FOLIO_ANDROID_KEY_ALIAS }}
          FOLIO_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FOLIO_ANDROID_KEYSTORE_BASE64:?Missing FOLIO_ANDROID_KEYSTORE_BASE64 secret}"
          : "${FOLIO_ANDROID_STORE_PASSWORD:?Missing FOLIO_ANDROID_STORE_PASSWORD secret}"
          : "${FOLIO_ANDROID_KEY_ALIAS:?Missing FOLIO_ANDROID_KEY_ALIAS secret}"
          : "${FOLIO_ANDROID_KEY_PASSWORD:?Missing FOLIO_ANDROID_KEY_PASSWORD secret}"
          printf '%s' "$FOLIO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/folia-release.jks"
          chmod 600 "$RUNNER_TEMP/folia-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/folia-release.jks" \
            -storepass:env FOLIO_ANDROID_STORE_PASSWORD \
            -alias "$FOLIO_ANDROID_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          FOLIO_ANDROID_STORE_FILE: ${{ runner.temp }}/folia-release.jks
          FOLIO_ANDROID_STORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_STORE_PASSWORD }}
          FOLIO_ANDROID_KEY_ALIAS: ${{ secrets.FOLIO_ANDROID_KEY_ALIAS }}
          FOLIO_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify release signature
        env:
          FOLIO_ANDROID_STORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_STORE_PASSWORD }}
          FOLIO_ANDROID_KEY_ALIAS: ${{ secrets.FOLIO_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          expected=$(keytool -exportcert -keystore "$RUNNER_TEMP/folia-release.jks" \
            -storepass:env FOLIO_ANDROID_STORE_PASSWORD \
            -alias "$FOLIO_ANDROID_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          actual=$("$apksigner" verify --print-certs "$apk" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual" != "$expected" ]; then
            echo 'APK certificate does not match the release keystore' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: folia-signed-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
